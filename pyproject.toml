[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "choxr"
version = "0.1.0"
description = "Exchange-agnostic order planning and execution engine"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
    "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["engine*", "adapters*", "strategies*", "app*"]
